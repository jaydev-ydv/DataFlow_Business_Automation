services:
  - type: web
    name: dataflow-backend
    runtime: python
    rootDir: Backend(Flask ApI)
    buildCommand: pip install -r requirement.txt
    startCommand: flask --app app db upgrade && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:8501,http://127.0.0.1:8501"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
